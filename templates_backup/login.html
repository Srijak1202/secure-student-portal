{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <h2>Login</h2>
    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">Login</button>
    </form>
    <p class="note">Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>.</p>
    <p class="note">Security: Salted Password Hashing is active.</p>
    <p class="note" style="margin-top: 15px;"><a href="{{ url_for('auth.access_control') }}"
            style="color: #004085; font-weight: bold;">View Access Control Matrix</a></p>
</div>
{% endblock %}
