{% extends "base.html" %}

{% block content %}
<div class="auth-container" style="max-width: 600px;">
    <h2>Edit Profile</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name" value="{{ profile.full_name }}" required>
        </div>
        <div class="form-group">
            <label>Roll No</label>
            <input type="text" name="roll_no" value="{{ profile.roll_no }}">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ profile.email }}" required>
        </div>
        <div class="form-group">
            <label>Contact No</label>
            <input type="text" name="contact" value="{{ profile.contact }}">
        </div>
        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" name="dob" value="{{ profile.dob }}">
        </div>
        <div class="form-group">
            <label>Blood Group</label>
            <input type="text" name="blood_group" value="{{ profile.blood_group }}">
        </div>
        <div class="form-group">
            <label>Profile Picture</label>
            <input type="file" name="profile_pic">
            <small>Current: {{ profile.profile_pic }}</small>
        </div>
        <button type="submit" class="btn">Save Changes</button>
        <a href="{{ url_for('student.dashboard') }}" class="btn" style="background:#6c757d;">Cancel</a>
    </form>
</div>
{% endblock %}
