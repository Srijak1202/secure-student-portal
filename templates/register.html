{% extends "base.html" %}

{% block content %}
<div class="auth-container fade-in">
    <div style="text-align: center; margin-bottom: 20px;">
        <i class="fa-solid fa-user-plus" style="font-size: 3rem; color: var(--primary);"></i>
    </div>
    <h2>Student Registration</h2>
    <div class="alert alert-info" style="font-size:0.9rem;">
        <i class="fa-solid fa-circle-info"></i> Faculty members must be registered by the Administrator.
    </div>
    <form method="POST">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
            <label for="username">Roll No (Username)</label>
            <input type="text" id="username" name="username" placeholder="e.g. CB.EN.U4CSE23001" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a strong password" required>
        </div>
        <div class="form-group">
            <label>Academic Details</label>
            <div style="display:flex; gap:10px;">
                <input type="text" name="degree" placeholder="Degree (e.g. B.Tech)" required style="width:50%">
                <input type="text" name="branch" placeholder="Branch (e.g. CSE)" required style="width:50%">
            </div>
        </div>
        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" name="dob" required>
        </div>
        <div class="form-group">
            <label>Personal Info</label>
            <div style="display:flex; gap:10px;">
                <input type="text" name="contact" placeholder="Contact No" required style="width:50%">
                <input type="text" name="blood_group" placeholder="Blood Grp" required style="width:50%">
            </div>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="student@university.edu" required>
        </div>

        <button type="submit" class="btn btn-primary full-width">
            <i class="fa-solid fa-user-plus"></i> Register as Student
        </button>
    </form>
    <div class="note" style="margin-top: 20px;">
        <p>Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>.</p>
    </div>
</div>
{% endblock %}
